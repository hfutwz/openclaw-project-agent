version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: seatflow-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: seatflow123
      MYSQL_DATABASE: seatflow
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./code-agent/backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./code-agent/backend/src/main/resources/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 可选：后端 API 容器化部署（如需全容器部署）
  # api:
  #   build:
  #     context: ./code-agent/backend
  #     dockerfile: Dockerfile
  #   container_name: seatflow-api
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/seatflow?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
  #     SPRING_DATASOURCE_USERNAME: root
  #     SPRING_DATASOURCE_PASSWORD: seatflow123
